name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 scripts/check_package.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/generate_catalog.py --check
      - run: python3 -m unittest discover -s examples/single-script -v
